name: Build Firefox Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub release and upload bin/ytc.xpi"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            content-scripts/package-lock.json
            service-worker/package-lock.json
            ui/package-lock.json

      - name: Install content-scripts dependencies
        run: npm ci
        working-directory: content-scripts

      - name: Install service-worker dependencies
        run: npm ci
        working-directory: service-worker

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Build Firefox package
        run: bash ./build.sh

      - name: Read manifest version
        id: manifest
        run: |
          VERSION=$(node -p "require('./manifest.json.firefox').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: ChannelQuarantine v${{ steps.manifest.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: bin/ytc.xpi
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
